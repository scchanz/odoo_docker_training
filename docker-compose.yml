version: "3.9"
services:
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
      - ./addons:/mnt/extra-addons

  odoo18:
    image: odoo:18
    depends_on:
      - db
    ports:
      - "10118:8069"
      - "20118:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - PGDATABASE=postgres
    volumes:
      - ./addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - odoo-web-data:/var/lib/odoo

volumes:
  odoo-web-data:
  odoo-db-data:
